version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyops-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/skyops
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AVIATION_WEATHER_BASE_URL: ${AVIATION_WEATHER_BASE_URL:-https://aviationweather.gov/api/data}
      NOTAM_API_BASE_URL: ${NOTAM_API_BASE_URL:-https://external.faa.gov/fim/}
      NOTAM_API_KEY: ${NOTAM_API_KEY:-}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    networks:
      - skyops-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mongo:
    image: mongo:7.0
    container_name: skyops-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: skyops
    volumes:
      - mongo-data:/data/db
    networks:
      - skyops-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
    driver: local

networks:
  skyops-net:
    driver: bridge
